name: Watch OpenRepos

# Three times an hour, queue a scan for each RPM newly released on OpenRepos. Scans run
# one at a time, at most INTAKE_MAX_SCANS per rolling hour. The watch position
# and the queue live in intake/state.json on the results branch.
on:
  # GitHub starts scheduled runs late and sometimes skips them, so this runs
  # more often than the hourly limit needs; the limit itself is in intake.py.
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # intake/state.json on the results branch
  actions: write    # start scan runs

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # waits for each scan it starts
    env:
      INTAKE_MAX_SCANS: 5
    steps:
      - uses: actions/checkout@v4

      - name: Find and queue new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch results "$remote" store 2>/dev/null; then
            git init --quiet --initial-branch results store
            git -C store remote add origin "$remote"
          fi
          python3 -I scripts/intake.py store/intake/state.json | tee -a "$GITHUB_STEP_SUMMARY"
          # The run waits for its scans, and each of them pushes a result to
          # this branch meanwhile. Only the intake writes the state file, so
          # put it on top of a fresh clone rather than rebasing.
          cp store/intake/state.json state.json
          for attempt in 1 2 3 4 5; do
            rm -rf store
            git clone --quiet --depth 1 --branch results "$remote" store 2>/dev/null || {
              git init --quiet --initial-branch results store
              git -C store remote add origin "$remote"
            }
            mkdir -p store/intake && cp state.json store/intake/state.json
            git -C store add intake/state.json
            git -C store -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "intake: $(date -u +%FT%TZ)"
            git -C store push --quiet origin results && exit 0
            sleep $((attempt * 3))
          done
          echo "::error::could not save the intake state"; exit 1
