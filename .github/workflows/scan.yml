name: Scan RPM

on:
  workflow_dispatch:
    inputs:
      rpm_url:
        description: HTTPS URL of the RPM to scan
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the RPM (optional)
        required: false
        type: string

run-name: Scan ${{ inputs.rpm_url }}

permissions:
  contents: read

jobs:
  scan:
    # Untrusted input: GitHub-hosted runners only, never self-hosted.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scanners

      - name: Download RPM
        env:
          RPM_URL: ${{ inputs.rpm_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          case "$RPM_URL" in
            https://*) ;;
            *) echo "::error::rpm_url must be an https:// URL"; exit 2 ;;
          esac
          mkdir sample
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --max-filesize 1073741824 --max-time 600 \
            --output sample/package.rpm -- "$RPM_URL"
          sha256sum sample/package.rpm
          if [ -n "$EXPECTED_SHA256" ]; then
            echo "${EXPECTED_SHA256,,}  sample/package.rpm" | sha256sum --check
          fi

      - name: Scan
        env:
          RPM_URL: ${{ inputs.rpm_url }}
        run: scripts/scan.sh sample/package.rpm db/yara db/clamav report

      - name: Summary
        if: always()
        run: |
          [ -f report/summary.md ] && cat report/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # Logs and metadata only; the package itself is not re-published.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastguard-report
          path: report/
          if-no-files-found: ignore

  # Separate job so the one that handles the untrusted package never holds a
  # write token. Stores packages/<name>/<sha256>.json on the results branch.
  publish:
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coastguard-report
          path: report

      - name: Store result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -f report/report.json ] || { echo "no report produced, nothing to store"; exit 0; }
          verdict=$(jq -r .verdict report/report.json)
          sha256=$(jq -r .sha256 report/report.json)
          name=$(jq -r .name report/report.json)
          # An incomplete scan is not a verdict and must not replace one.
          case "$verdict" in
            clean|detected) ;;
            *) echo "verdict '$verdict' is not stored"; exit 0 ;;
          esac
          # Both values end up in a path and come from the scanned package.
          [[ $sha256 =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]] || name=_unnamed
          jq --arg run "$RUN_URL" '. + {run: $run}' report/report.json > result.json

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Scans run in parallel, so retry from a fresh clone when the push loses a race.
          for attempt in 1 2 3 4 5; do
            rm -rf store
            if ! git clone --quiet --depth 1 --branch results "$remote" store 2>/dev/null; then
              git init --quiet --initial-branch results store
              git -C store remote add origin "$remote"
            fi
            mkdir -p "store/packages/$name"
            cp result.json "store/packages/$name/$sha256.json"
            git -C store add -A
            git -C store -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --allow-empty -m "$name: $verdict ($sha256)"
            if git -C store push --quiet origin results; then
              echo "stored packages/$name/$sha256.json" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push result"; exit 1
