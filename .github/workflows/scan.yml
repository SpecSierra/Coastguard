name: Scan RPM

on:
  workflow_dispatch:
    inputs:
      rpm_url:
        description: HTTPS URL of the RPM to scan
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the RPM (optional)
        required: false
        type: string

run-name: Scan ${{ inputs.rpm_url }}

permissions:
  contents: read

jobs:
  scan:
    # Untrusted input: GitHub-hosted runners only, never self-hosted.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scanners

      - name: Download RPM
        env:
          RPM_URL: ${{ inputs.rpm_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          case "$RPM_URL" in
            https://*) ;;
            *) echo "::error::rpm_url must be an https:// URL"; exit 2 ;;
          esac
          mkdir sample
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --max-filesize 1073741824 --max-time 600 \
            --output sample/package.rpm -- "$RPM_URL"
          sha256sum sample/package.rpm
          if [ -n "$EXPECTED_SHA256" ]; then
            echo "${EXPECTED_SHA256,,}  sample/package.rpm" | sha256sum --check
          fi

      - name: Scan
        env:
          RPM_URL: ${{ inputs.rpm_url }}
        run: scripts/scan.sh sample/package.rpm db/yara db/clamav report

      - name: Summary
        if: always()
        run: |
          [ -f report/summary.md ] && cat report/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # Logs and metadata only; the package itself is not re-published.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastguard-report
          path: report/
          if-no-files-found: ignore

  # Separate job so the one that handles the untrusted package never holds a
  # write token or an API key. It only sees the report: hashes and metadata.
  publish:
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coastguard-report
          path: report

      # Hashes only, never file content. Each service is skipped without its key.
      - name: Hash reputation
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          MALWAREBAZAAR_AUTH_KEY: ${{ secrets.MALWAREBAZAAR_AUTH_KEY }}
        run: |
          [ -f report/report.json ] || { echo "no report produced"; exit 0; }
          python3 -I scripts/reputation.py report

      - name: Store result and compare with previous version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -f report/report.json ] || { echo "no report produced, nothing to store"; exit 0; }
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Scans run in parallel, so retry from a fresh clone when the push loses a race.
          for attempt in 1 2 3 4 5; do
            rm -rf store
            if ! git clone --quiet --depth 1 --branch results "$remote" store 2>/dev/null; then
              git init --quiet --initial-branch results store
              git -C store remote add origin "$remote"
            fi
            rc=0
            message=$(python3 -I scripts/store_result.py store report "$RUN_URL") || rc=$?
            if [ "$rc" -eq 3 ]; then echo "scan has no verdict, nothing stored"; exit 0; fi
            [ "$rc" -eq 0 ] || exit "$rc"
            git -C store add -A
            git -C store -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --allow-empty -m "$message"
            if git -C store push --quiet origin results; then
              cat report/final.md >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push result"; exit 1

      # Red run when a reputation service knows the package as malware, even
      # if the local signatures found nothing.
      - name: Verdict
        run: |
          verdict=$(cat report/final-verdict 2>/dev/null || echo none)
          echo "final verdict: $verdict"
          [ "$verdict" != detected ]
