name: Self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scanners
      - name: Clean and EICAR packages get the right verdict
        run: tests/selftest.sh db/yara db/clamav
